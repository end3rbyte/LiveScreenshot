name: Publish LiveScreenshot 1.0.0 prerelease

on:
  workflow_dispatch:
  push:
    tags:
      - v1.0.0

permissions:
  contents: read

concurrency:
  group: livescreenshot-prerelease-1.0.0

jobs:
  publish:
    runs-on: windows-2025
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    env:
      RELEASE_TAG: v1.0.0

    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          persist-credentials: false

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Build and package Windows x64
        run: |
          dotnet publish LiveScreenshot.csproj --configuration Release \
            --runtime win-x64 --self-contained true \
            -p:Version="${RELEASE_TAG#v}" --output "$RUNNER_TEMP/publish"
          test -f "$RUNNER_TEMP/publish/LiveScreenshot.exe"
          "$WINDIR/System32/tar.exe" -a -cf "$RUNNER_TEMP/LiveScreenshot-$RELEASE_TAG-win-x64.zip" \
            -C "$RUNNER_TEMP/publish" .

      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" "$RUNNER_TEMP/LiveScreenshot-$RELEASE_TAG-win-x64.zip" \
            --repo "$GITHUB_REPOSITORY" --verify-tag --prerelease --latest=false \
            --title "LiveScreenshot ${RELEASE_TAG#v}" --generate-notes
