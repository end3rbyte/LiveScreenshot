name: Publish LiveScreenshot 1.0.0 prerelease

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-2025
    concurrency:
      group: livescreenshot-prerelease-1.0.0
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    env:
      RELEASE_TAG: v1.0.0

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Build and package Windows x64
        shell: pwsh
        run: |
          $publishPath = Join-Path $env:RUNNER_TEMP 'publish'
          $zipPath = Join-Path $env:RUNNER_TEMP "LiveScreenshot-$env:RELEASE_TAG-win-x64-$env:GITHUB_SHA.zip"
          $version = $env:RELEASE_TAG.Substring(1)
          dotnet publish LiveScreenshot.csproj --configuration Release `
            --runtime win-x64 --self-contained true -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None `
            "-p:Version=$version" --output $publishPath
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          [IO.Compression.ZipFile]::CreateFromDirectory($publishPath, $zipPath)
          $archive = [IO.Compression.ZipFile]::OpenRead($zipPath)
          try {
            $entry = $archive.GetEntry('LiveScreenshot.exe')
            if ($archive.Entries.Count -ne 1 -or $null -eq $entry -or $entry.Length -eq 0) {
              throw 'The ZIP must contain exactly one non-empty file named LiveScreenshot.exe.'
            }
          } finally {
            $archive.Dispose()
          }

      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Skip publication if a newer commit has already reached main.
          main_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          if [[ "$main_sha" != "$GITHUB_SHA" ]]; then
            echo "Skipping publication because main has advanced to $main_sha."
            exit 0
          fi

          asset="LiveScreenshot-$RELEASE_TAG-win-x64-$GITHUB_SHA.zip"
          prerelease=$(gh release view "$RELEASE_TAG" --json isPrerelease,isDraft --jq '.isPrerelease and (.isDraft | not)')
          if [[ "$prerelease" != true ]]; then
            echo "Expected a published prerelease for $RELEASE_TAG." >&2
            exit 1
          fi

          assets=$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[] | [.name, .state] | @tsv')
          if ! grep -Fxq "$asset"$'\t'uploaded <<< "$assets"; then
            gh release upload "$RELEASE_TAG" "$RUNNER_TEMP/$asset" --clobber
          fi

          download_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG/$asset"
          commit_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/$GITHUB_SHA"
          notes=$(printf '[Download LiveScreenshot for Windows x64](%s)\n\nBuilt from [`%s`](%s).\n' "$download_url" "$GITHUB_SHA" "$commit_url")
          gh release edit "$RELEASE_TAG" --prerelease --latest=false --notes "$notes"

          # Remove older Windows packages only after the new ZIP is available.
          package_prefix="LiveScreenshot-$RELEASE_TAG-win-x64"
          while IFS=$'\t' read -r previous_asset state; do
            if [[ "$previous_asset" != "$asset" && ( "$previous_asset" == "$package_prefix.zip" || "$previous_asset" == "$package_prefix-"*.zip ) ]]; then
              gh release delete-asset "$RELEASE_TAG" "$previous_asset" --yes
            fi
          done <<< "$assets"
